[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-response-classifier"
version = "0.1.0"
description = "Classify LLM response text into labeled categories using regex rule patterns"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["llm", "classification", "nlp", "response", "intent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_response_classifier = ["py.typed"]
